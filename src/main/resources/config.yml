# ============================================
#   SquareStar - minihry na Marsu (AdrrexStudio)
# ============================================

gravity:
  enabled: true
  # normalni Minecraft = 0.08 | Mars ~ 0.03 | Mesic ~ 0.013
  value: 0.03
  # z jake vysky se nebere poskozeni padem
  safe-fall-distance: 12
  # dalsi svety, kde ma byt nizka gravitace (napr. "world")
  extra-worlds: []

lobby:
  # po pripojeni posle hrace na Mars lobby
  force-on-join: true
  # obri 3D letajici napis (A-Z, 0-9, mezera, ! a -)
  title: "SQUARESTAR"
  # dvojskok v lobby (2x mezernik)
  double-jump: true
  # úvodní animace (kamera přeletí Mars) při každém připojení, přeskočit = Shift
  intro: true
  # VidRift postava v lobby („podívej se na film")
  vidrift-npc: true
  fx:
    title: true
    title-scale: 1.4
    title-style: model   # model = hezké 3D logo, blocks = kostičky
    logo-size: 28
    rocket: true
    # rychlost rakety (vic = rychleji)
    rocket-speed: 0.03
    # obri 3D Zeme, ktera se toci (potrebuje resource pack)
    earth: true
    earth-size: 90
  # skin NPC z resource packu (soubor textures/entity/npc_skin.png)
  npc-skin-from-pack: true

# odpocet pred startem hry (sekundy)
countdown: 15
# kolik her muze bezet najednou (na slabem free serveru dej 2-3)
max-arenas: 4
# kolik bloku za tick se stavi pri tvorbe map (mensi = mene lagu)
blocks-per-tick: 6000

ranks:
  # odznaky (obrazky) i v tabu a nad hlavou - doporuceno s require-resource-pack=true
  badges-in-tab: true
  # kam vede klikaci odznak VIDRIFTER v chatu
  vidrift-url: "https://vidriftvideo.netlify.app"

build-battle:
  # kolik sekund se stavi
  build-seconds: 300

# odmena za vyhru
win-reward:
  key: common
  amount: 1

# BEDNY - zatim bez placeni. Klice: vyhry v minihrach nebo /ss key <hrac> <typ> [pocet]
# odmena = "druh:id:pocet:vaha"   druh: item (Minecraft item) | space (vesmirny item) | key (klic od bedny)
crates:
  common:
    name: "&a&lObyčejná bedna"
    location: [-4, 100, 9]
    rewards:
      - "space:space_ration:8:30"
      - "space:moon_rock:4:25"
      - "space:meteor_grenade:3:20"
      - "item:EXPERIENCE_BOTTLE:16:15"
      - "space:star_shard:1:8"
      - "key:rare:1:2"
  rare:
    name: "&9&lVzácná bedna"
    location: [0, 100, 9]
    rewards:
      - "space:jetpack:1:25"
      - "space:gravity_boots:1:20"
      - "space:oxygen_helmet:1:20"
      - "space:star_shard:3:20"
      - "item:DIAMOND:3:10"
      - "key:legendary:1:5"
  legendary:
    name: "&6&l✦ Legendární bedna"
    location: [4, 100, 9]
    rewards:
      - "space:laser_pistol:1:30"
      - "space:plasma_sword:1:30"
      - "space:star_shard:10:25"
      - "item:NETHERITE_INGOT:1:10"
      - "item:ELYTRA:1:5"

# hezké GUI pozadí z resource packu (false = obyčejné menu)
gui:
  custom: true

# údržba: připojí se jen tým (builder, helper, moderator, admin, owner). Příkaz: /ss udrzba on|off
maintenance:
  enabled: false

# Práva podle ranku (dávají se automaticky, LuckPerms není potřeba).
# Když tu sekce chybí, platí výchozí práva: OWNER = OP, ADMIN = skoro vše, MODERATOR = kick/ban/tp/spectate,
# HELPER = kick/tp, BUILDER = gamemode/tp/give/fill. Vlastní seznam např.:
# rank-permissions:
#   helper:
#     - minecraft.command.kick
#     - minecraft.command.tp

# Resource pack posílá plugin (jen Java hráčům; Bedrock ho nedostane, jinak by ho to vyhodilo).
# V server.properties proto NECH resource-pack prázdné a require-resource-pack=false.
resource-pack:
  enabled: true
  required: true
  url: "https://raw.githubusercontent.com/AdamL2014/SquareStar-/main/download/SquareStar-ResourcePack.zip"

# Ochrana proti multiúčtům: max hráčů z jedné IP adresy (0 = vypnuto). Owner a Admin mají výjimku.
security:
  max-per-ip: 5

# automaticka aktualizace z GitHubu (download/version.txt + SquareStar.jar)
auto-update:
  enabled: true
  # jak často se server pta GitHubu na novou verzi (sekundy, min 5)
  check-seconds: 10
  # po nalezeni nove verze: hraci dostanou hned kick, za tolik sekund se server vypne (a hosting ho zapne s novym jarem)
  shutdown-delay-seconds: 3

# Pety nad hlavou (kosmetika -> 3D čepice -> Pet:)
pets:
  # když se pet kouká dozadu místo dopředu, dej 180 (a restart)
  yaw-offset: 0

# ============================================
#   AdrrexAI - chatovaci pomocnik (Groq)
# ============================================
ai:
  enabled: true
  # API klic z https://console.groq.com/keys  (NEPOSILEJ ho nikomu, nedavej ho na GitHub)
  # misto sem ho muzes dat i do promenne prostredi GROQ_API_KEY
  groq-api-key: ""
  model: "llama-3.3-70b-versatile"
  max-tokens: 450
  fallback-models: ["llama-3.1-8b-instant", "openai/gpt-oss-20b", "openai/gpt-oss-120b"]   # záloha při 413/429/404 (zkouší se popořadě)
  cooldown-seconds: 4
  # tydenni limit zprav (tym/admini maji bez limitu)
  limit-free: 3
  limit-vip: 10
  max-per-minute: 25
  # dalsi informace o serveru, ktere ma AI znat (kazda polozka = jedna veta)
  extra-knowledge: []
