name: SquareStar
version: '4.0.0'
main: cz.adrrex.squarestar.SquareStar
api-version: '1.21.11'
author: AdrrexStudio
description: Minihry na Marsu s nizkou gravitaci
commands:
  ss:
    description: SquareStar minihry
    aliases: [squarestar, hry]
  udrzba:
    description: Udrzba serveru (/udrzba on|off) - pripoji se jen tym
    aliases: [maintenance]
  emote:
    description: Emoty (/emote hi)
    aliases: [e, emoty]
  pritel:
    description: Pratele (/pritel pridat|prijmout|odebrat)
    aliases: [friend, friends, f, pratele]
  event:
    description: Eventy - poradani (majitel/admin) a pripojeni (/event join)
  fly:
    description: Letani v lobby (VIP+, influenceri, tym)
    aliases: [letat]
  novinky:
    description: Co je noveho na serveru
    aliases: [news, changelog]
permissions:
  squarestar.admin:
    description: Admin prikazy (give, key, rebuildlobby)
    default: op
